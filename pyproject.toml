[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dietbot"
version = "0.3.3"
description = "Tygodniowy jadłospis dla dwóch osób: LLM układa, deterministyczny silnik liczy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ortools==9.15.6755",
    "pydantic>=2.13,<3",
    "ruamel.yaml>=0.19",
    "rapidfuzz>=3.14",
    "simplemma>=2.0",
    "openai>=3.13",
    "typer>=0.27",
    "rich>=15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.16"]
app = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pywebview>=6.2",
    "aiogram>=3.31",
]
build = ["pyinstaller>=6.16", "pillow>=12"]

[project.scripts]
dietbot = "dietbot.cli:app"

[project.gui-scripts]
dietbot-okno = "dietbot.app.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/dietbot/cli.py" = ["B008"]  # typer.Option/Argument w domyślnych wartościach to idiom Typera
