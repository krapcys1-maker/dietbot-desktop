# Przekąski bilansujące — silnik dodaje maksymalnie jedną dziennie na osobę i tylko wtedy, gdy pomaga
# zmieścić się w widełkach (każda przekąska ma w silniku koszt). Ilości nie skalują się z celem energii.

- id: przekaska_szejk_bialkowy
  nazwa: Szejk białkowy (odżywka WPC z wodą)
  posilki: [przekaska]
  kuchnia: miedzynarodowa
  tagi: [szybkie]
  skladniki:
  - {produkt: odzywka_bialkowa_wpc, rola: bialko, typowo_g: 30, min_g: 25, max_g: 35, skaluje_sie: false}
  przygotowanie:
  - Wymieszaj odżywkę z 250–300 ml zimnej wody w shakerze.
  zrodlo: założenia użytkownika (szejk na bazie odżywki białkowej, ok. 30 g proszku)
  status: zatwierdzone
