# Przekąski z puli 20% z założeń domowników („duża porcja lodów”, „paczka chipsów”, „batonik”, „kawałek ciasta”).
# Planer wstawia je jako dodatek do trzech posiłków w dniu bez innego posiłku z puli 20% i liczy do puli tygodnia
# (2–3 rzeczy w tygodniu). Silnik dobiera porcję w podanym zakresie i dopasowuje do niej gramatury całego dnia.

- id: przekaska20_lody_waniliowe
  nazwa: Lody waniliowe (duża porcja)
  opis: Kilka gałek lodów waniliowych na deser.
  posilki: [przekaska]
  kuchnia: miedzynarodowa
  tagi: [pula_20, slodkie, szybkie]
  skladniki:
    - {produkt: lody_waniliowe, rola: dodatek, typowo_g: 150, min_g: 100, max_g: 200}
  przygotowanie:
    - Nałóż lody do miseczki (gałka to ok. 50 g).
  czas_min: 2
  zrodlo: założenia domowników — pula 20% (BLS 4.0)
  status: zatwierdzone

