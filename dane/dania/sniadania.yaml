- id: kanapki_z_szynka_jajkiem_i_pomidorem
  nazwa: Kanapki z szynką, jajkiem i pomidorem
  opis: Klasyczne kanapki na bułce z masłem, szynką, jajkiem na twardo i pomidorem.
  posilki: [sniadanie, kolacja]
  kuchnia: polska
  tagi: [szybkie]
  skladniki:
    - {produkt: bulka_pszenna, rola: weglowodany, typowo_g: 100}
    - {produkt: maslo, rola: tluszcz, typowo_g: 5, opcjonalny: true}
    - {produkt: szynka_gotowana, rola: bialko, typowo_g: 60}
    - {produkt: jajko_kurze, rola: bialko, typowo_g: 100, jednostka: szt}
    - {produkt: pomidor, rola: warzywa, typowo_g: 150}
  przygotowanie:
    - Jajka ugotuj na twardo (9–10 minut), obierz i pokrój w plastry.
    - Bułki przekrój, posmaruj cienko masłem, połóż szynkę, jajko i plastry pomidora.
  czas_min: 15
  zrodlo: DietBot — biblioteka startowa
  status: zatwierdzone

