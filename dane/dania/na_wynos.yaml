- id: pizza_domowa_z_szynka_i_pieczarkami
  nazwa: Pizza domowa z szynką, pieczarkami i mozzarellą
  opis: Pizza na gotowym cieście z sosem pomidorowym, szynką, pieczarkami, mozzarellą i oregano.
  posilki: [obiad, kolacja]
  kuchnia: wloska
  tagi: [pula_20, na_cieplo]
  skladniki:
    - {produkt: ciasto_na_pizze, rola: weglowodany, porcjowanie: z_garnka, typowo_g: 150}
    - {produkt: passata, rola: sos, porcjowanie: z_garnka, typowo_g: 60}
    - {produkt: mozzarella, rola: bialko, porcjowanie: z_garnka, typowo_g: 70}
    - {produkt: szynka_gotowana, rola: bialko, porcjowanie: z_garnka, typowo_g: 50}
    - {produkt: pieczarki, rola: warzywa, porcjowanie: z_garnka, typowo_g: 60}
    - {produkt: oregano_suszone, rola: przyprawa, typowo_g: 1}
  przygotowanie:
    - Rozgrzej piekarnik do 230°C, rozwałkuj ciasto na blasze.
    - Posmaruj passatą, ułóż szynkę, plasterki pieczarek i porwaną mozzarellę, posyp oregano.
    - Piecz 12–15 minut, aż brzegi się zarumienią; podziel pizzę według porcji z planu.
  czas_min: 30
  zrodlo: DietBot — jedzenie na wynos (BLS 4.0)
  status: zatwierdzone
