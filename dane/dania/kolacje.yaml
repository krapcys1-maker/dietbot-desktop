- id: salatka_grecka_z_kurczakiem
  nazwa: Sałatka grecka z grillowanym kurczakiem
  opis: Kurczak, feta, pomidor, ogórek, papryka i oliwki z oliwą, kromka pieczywa.
  posilki: [kolacja]
  kuchnia: miedzynarodowa
  tagi: []
  skladniki:
  - {produkt: piers_z_kurczaka, rola: bialko, typowo_g: 140}
  - {produkt: feta, rola: bialko, typowo_g: 35}
  - {produkt: pomidor, rola: warzywa, typowo_g: 120}
  - {produkt: ogorek, rola: warzywa, typowo_g: 120}
  - {produkt: papryka_czerwona, rola: warzywa, typowo_g: 80}
  - {produkt: oliwki_zielone, rola: dodatek, typowo_g: 15, opcjonalny: true}
  - {produkt: oliwa_z_oliwek, rola: tluszcz, typowo_g: 7}
  - {produkt: chleb_mieszany, rola: weglowodany, typowo_g: 60}
