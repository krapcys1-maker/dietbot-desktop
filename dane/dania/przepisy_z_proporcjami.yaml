    - {produkt: wolowina_gulaszowa, rola: bialko, porcjowanie: z_garnka, typowo_g: 150}
    - {produkt: cebula, rola: warzywa, porcjowanie: z_garnka, typowo_g: 50}
    - {produkt: koncentrat_pomidorowy, rola: sos, porcjowanie: z_garnka, typowo_g: 15}
    - {produkt: olej_rzepakowy, rola: tluszcz, porcjowanie: z_garnka, typowo_g: 8}
    - {produkt: kapusta_biala, rola: warzywa, typowo_g: 100}
    - {produkt: marchew, rola: warzywa, typowo_g: 50}
    - {produkt: sok_z_cytryny, rola: sos, typowo_g: 5}
    - {produkt: papryka_slodka_mielona, rola: przyprawa, typowo_g: 2}
    - {produkt: sol, rola: przyprawa, typowo_g: 2}
    - {produkt: pieprz_czarny, rola: przyprawa, typowo_g: 1}
