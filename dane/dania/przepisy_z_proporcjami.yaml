# Przepisy wzorcowe z grupami składników. Grupa to jedna masa w przepisie (ciasto, panierka, masa mielona, farsz,
# surówka): silnik może zrobić jej więcej albo mniej, ale udział każdego składnika w masie zostaje jak w "typowo_g"
# (± tolerancja, domyślnie 5%, plus jeden krok wagi na zaokrąglenie). Weryfikator sprawdza to niezależnie.

- id: nalesniki_z_twarogiem_i_miodem
  nazwa: Naleśniki z twarogiem i miodem
  opis: Cienkie naleśniki na mleku z farszem z twarogu, jogurtu i miodu, z cynamonem.
  posilki: [kolacja]
  kuchnia: polska
  tagi: [slodkie, na_cieplo]
  skladniki:
    - {produkt: maka_pszenna, rola: weglowodany, porcjowanie: z_garnka, typowo_g: 55}
    - {produkt: mleko_1_5, rola: nabial, porcjowanie: z_garnka, typowo_g: 130}
    - {produkt: jajko_kurze, rola: dodatek, porcjowanie: z_garnka, typowo_g: 30}
    - {produkt: olej_rzepakowy, rola: tluszcz, porcjowanie: z_garnka, typowo_g: 5}
    - {produkt: twarog_poltlusty, rola: bialko, porcjowanie: z_garnka, typowo_g: 160}
    - {produkt: jogurt_naturalny_1_5, rola: nabial, porcjowanie: z_garnka, typowo_g: 30}
    - {produkt: miod, rola: dodatek, porcjowanie: z_garnka, typowo_g: 10}
    - {produkt: cynamon, rola: przyprawa, typowo_g: 1}
  grupy:
    - {nazwa: ciasto naleśnikowe, skladniki: [maka_pszenna, mleko_1_5, jajko_kurze, olej_rzepakowy]}
    - {nazwa: farsz twarogowy, skladniki: [twarog_poltlusty, jogurt_naturalny_1_5, miod]}
  przygotowanie:
    - Mąkę, mleko, jajko i połowę oleju zmiksuj na gładkie ciasto i odstaw na 10 minut.
    - Rozgrzej patelnię, przetrzyj ją resztą oleju i smaż cienkie naleśniki z obu stron.
    - Twaróg rozgnieć widelcem z jogurtem, miodem i cynamonem.
    - Naleśniki posmaruj farszem i zwiń w rulony albo złóż w trójkąty.
  czas_min: 30
  zrodlo: DietBot — przepis wzorcowy z proporcjami
  status: zatwierdzone

- id: nalesniki_z_kurczakiem_i_szpinakiem
  nazwa: Naleśniki z kurczakiem i szpinakiem zapiekane z mozzarellą
  opis: Naleśniki nadziewane kurczakiem ze szpinakiem w sosie śmietanowym, zapieczone z mozzarellą.
  posilki: [obiad]
  kuchnia: polska
  tagi: [na_cieplo]
  skladniki:
    - {produkt: maka_pszenna, rola: weglowodany, porcjowanie: z_garnka, typowo_g: 60}
    - {produkt: mleko_1_5, rola: nabial, porcjowanie: z_garnka, typowo_g: 150}
    - {produkt: jajko_kurze, rola: dodatek, porcjowanie: z_garnka, typowo_g: 30}
    - {produkt: olej_rzepakowy, rola: tluszcz, porcjowanie: z_garnka, typowo_g: 5}
    - {produkt: piers_z_kurczaka, rola: bialko, porcjowanie: z_garnka, typowo_g: 100}
    - {produkt: szpinak, rola: warzywa, porcjowanie: z_garnka, typowo_g: 100}
    - {produkt: smietana_10, rola: sos, porcjowanie: z_garnka, typowo_g: 30}
    - {produkt: oliwa_z_oliwek, rola: tluszcz, porcjowanie: z_garnka, typowo_g: 5}
    - {produkt: mozzarella_light, rola: dodatek, porcjowanie: z_garnka, typowo_g: 40}
    - {produkt: czosnek, rola: przyprawa, typowo_g: 3}
    - {produkt: sol, rola: przyprawa, typowo_g: 1}
    - {produkt: pieprz_czarny, rola: przyprawa, typowo_g: 1}
  grupy:
    - {nazwa: ciasto naleśnikowe, skladniki: [maka_pszenna, mleko_1_5, jajko_kurze, olej_rzepakowy]}
  przygotowanie:
    - Mąkę, mleko, jajko i olej zmiksuj na gładkie ciasto i usmaż cienkie naleśniki.
    - Kurczaka pokrój w kostkę i podsmaż na oliwie z czosnkiem, solą i pieprzem.
    - Dodaj szpinak i śmietanę, duś, aż szpinak zmięknie.
    - Nałóż farsz na naleśniki, zwiń je, posyp startą mozzarellą i zapiecz 10 minut w 200°C.
  czas_min: 40
  zrodlo: DietBot — przepis wzorcowy z proporcjami
  status: zatwierdzone

- id: kotlet_schabowy_z_ziemniakami_i_buraczkami
  nazwa: Kotlet schabowy z ziemniakami i buraczkami
  opis: Klasyczny schabowy w panierce z bułki tartej, z gotowanymi ziemniakami z koperkiem i buraczkami.
  posilki: [obiad]
  kuchnia: polska
  tagi: [na_cieplo]
  skladniki:
    - {produkt: schab, rola: bialko, typowo_g: 140}
    - {produkt: jajko_kurze, rola: dodatek, typowo_g: 15}
    - {produkt: bulka_tarta, rola: dodatek, typowo_g: 20}
    - {produkt: maka_pszenna, rola: dodatek, typowo_g: 8}
    - {produkt: olej_rzepakowy, rola: tluszcz, typowo_g: 10}
    - {produkt: ziemniaki, rola: weglowodany, typowo_g: 300}
    - {produkt: burak, rola: warzywa, typowo_g: 150}
    - {produkt: sok_z_cytryny, rola: sos, typowo_g: 5}
    - {produkt: koperek, rola: przyprawa, typowo_g: 3}
    - {produkt: sol, rola: przyprawa, typowo_g: 2}
    - {produkt: pieprz_czarny, rola: przyprawa, typowo_g: 1}
  grupy:
    - {nazwa: kotlet w panierce, skladniki: [schab, jajko_kurze, bulka_tarta, maka_pszenna]}
  przygotowanie:
    - Schab rozbij tłuczkiem na cienkie kotlety, posól i popieprz.
    - Obtocz mięso kolejno w mące, roztrzepanym jajku i bułce tartej.
    - Smaż na rozgrzanym oleju po 3–4 minuty z każdej strony.
    - Ziemniaki ugotuj w osolonej wodzie i posyp koperkiem.
    - Buraki ugotuj, zetrzyj na tarce i wymieszaj z sokiem z cytryny i szczyptą soli.
  czas_min: 45
  zrodlo: DietBot — przepis wzorcowy z proporcjami
  status: zatwierdzone

