    - {nazwa: surówka z kapusty, skladniki: [kapusta_biala, marchew, sok_z_cytryny]}
  przygotowanie:
    - Wołowinę pokrój w kostkę, obsmaż na oleju z cebulą i papryką, dodaj koncentrat i wodę, duś do miękkości (ok. 90 minut).
    - Ziemniaki ugotuj, przeciśnij przez praskę i wystudź; wymieszaj z mąką ziemniaczaną i szczyptą soli.
    - Formuj kulki, spłaszcz je i zrób palcem wgłębienie; gotuj w osolonej wodzie 2 minuty od wypłynięcia.
    - Kapustę poszatkuj, marchew zetrzyj, wymieszaj z sokiem z cytryny i solą.
