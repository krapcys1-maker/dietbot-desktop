name: Zgłoś błąd
description: Coś nie działa w Porcji
title: "[Błąd] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Nie dołączaj klucza API, pliku .env, prywatnej bazy, danych zdrowotnych ani całego folderu danych. Zrzuty sprawdź przed wysłaniem."
  - type: input
    id: version
    attributes:
      label: Wersja Porcji i Windows
      placeholder: "Porcja 0.3.3, Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Jak odtworzyć problem?
      description: Opisz kolejne kliknięcia, bez prywatnych danych.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Co miało się wydarzyć, a co się wydarzyło?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Dodatkowe informacje
      description: Treść błędu lub zrzut po usunięciu prywatnych informacji.
